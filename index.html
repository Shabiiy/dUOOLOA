<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUUO Brothers - Coming Soon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Preloader -->
    <div id="loader">
        <div id="loader-percentage">0%</div>
    </div>

    <!-- The user's image as the background -->
    <div class="bg-image"></div>

    <!-- Fluid Cursor Canvas -->
    <canvas id="fluid"
        style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 50; display: block;"></canvas>

    <div class="container">
        <!-- Top Text -->
        <div class="top-text fade-in" style="--delay: 0.2s">
            <p>DESIGN TO BUILD</p>
            <p>BY THE DUUO BROTHERS</p>
        </div>

        <!-- Vertical Divider 1 -->
        <div class="vertical-divider fade-in" style="--delay: 0.4s"></div>

        <!-- Spacer for the logo in the background image -->
        <div class="logo-spacer"></div>

        <!-- Motto Text -->
        <div class="motto-text fade-in" style="--delay: 0.6s">
            <p>Our people, Our process</p>
            <p>Experience how we turn ideas into <i>extraordinary</i> spaces.</p>
        </div>

        <!-- Vertical Divider 2 -->
        <div class="vertical-divider fade-in" style="--delay: 0.8s"></div>

        <!-- Tagline replacing button -->
        <div class="tagline-container fade-in" style="--delay: 1.0s">
            <div class="tagline-btn">
                <span>COMING SOON TO AMAZE YOU</span>
            </div>
        </div>
    </div>

    <script src="loader.js"></script>
    <script src="fluid.js"></script>
</body>

</html>
